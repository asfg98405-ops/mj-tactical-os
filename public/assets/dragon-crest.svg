<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="dragonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="50%" stop-color="#0077ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0a192f" stop-opacity="1" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber Hexagon -->
  <polygon points="100,10 180,55 180,145 100,190 20,145 20,55" 
           fill="#061224" stroke="#00f0ff" stroke-width="3" filter="url(#neonBlur)" />
  
  <!-- Inner Cyber Rings -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#00a2ff" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  <circle cx="100" cy="100" r="60" fill="#091a32" stroke="#00f0ff" stroke-width="1" opacity="0.8"/>

  <!-- Cyber Dragon Wings & Head Silhouette -->
  <!-- Left Wing -->
  <path d="M 100,75 C 70,50 40,65 35,95 C 50,90 70,105 100,110 Z" fill="url(#dragonGlow)" opacity="0.9" />
  <!-- Right Wing -->
  <path d="M 100,75 C 130,50 160,65 165,95 C 150,90 130,105 100,110 Z" fill="url(#dragonGlow)" opacity="0.9" />
  
  <!-- Dragon Spine & Crest -->
  <path d="M 100,40 L 108,55 L 100,65 L 92,55 Z" fill="#00f0ff" filter="url(#neonBlur)" />
  <path d="M 100,65 L 112,85 L 100,95 L 88,85 Z" fill="#00d2ff" />
  <path d="M 100,95 L 110,120 L 100,140 L 90,120 Z" fill="#0088ff" />
  
  <!-- Cyber Claws / Nodes -->
  <circle cx="100" cy="40" r="3" fill="#ffffff" filter="url(#neonBlur)" />
  <circle cx="50" cy="85" r="2.5" fill="#00f0ff" />
  <circle cx="150" cy="85" r="2.5" fill="#00f0ff" />

  <!-- Monogram MJ -->
  <text x="100" y="165" font-family="'Orbitron', 'Courier New', monospace" font-size="18" font-weight="900" 
        fill="#00f0ff" text-anchor="middle" letter-spacing="4" filter="url(#neonBlur)">MJ</text>
  <text x="100" y="177" font-family="'Orbitron', sans-serif" font-size="7" font-weight="600" 
        fill="#7dd3fc" text-anchor="middle" letter-spacing="2">TACTICAL OS</text>
</svg>
